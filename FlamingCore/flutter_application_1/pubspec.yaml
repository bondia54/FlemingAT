name: flemingcore
description: FlemingCore — App desktop Windows para gestão de farmácia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3
  http: ^1.2.2
  window_manager: ^0.4.3
  local_notifier: ^0.1.6
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  pdf: ^3.10.7
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
